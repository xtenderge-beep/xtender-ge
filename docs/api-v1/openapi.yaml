  "/categories":
    get:
      x-xtender-status: "implemented"
      x-xtender-stage: 1
      operationId: "searchCategories"
      tags:
        - "Catalog"
      summary: "Find categories for a need"
      description: "q is a plain-language need (\"bring 20 bags of rubbish down from the 2nd floor\"). Matching folds Georgian, Russian and Latin spelling and compares word beginnings; there is no server-side AI. match_status: none — nothing matched (do not invent a category); matched — one category; ambiguous — several (the task may need several, or the user must choose). match_rank is an order, not a probability. availability and supply_status refer to location_id; a supported category does not promise a free provider, a price or a reply. The catalog itself is read fresh on each request; supply counts are cached up to 5 minutes (checked_at)."
      security:
        - {}
        - oauth2: []
      parameters:
        - name: "q"
          in: "query"
          schema:
            type: "string"
            maxLength: 300
        - name: "lang"
          in: "query"
          description: "Response language. Default: the account language, otherwise en."
          schema:
            type: "string"
            enum:
              - "ka"
              - "ru"
              - "en"
        - name: "kind"
          in: "query"
          description: "Only service categories exist today; goods gives an empty list."
          schema:
            type: "string"
            enum:
              - "service"
              - "goods"
        - name: "location_id"
          in: "query"
          description: "From listLocations: city:<slug>, district:<slug> or country:GE."
          schema:
            type: "string"
        - name: "active_only"
          in: "query"
          schema:
            type: "boolean"
            default: true
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        - name: "cursor"
          in: "query"
          description: "next_cursor of the previous page. A stale cursor gives 409 SNAPSHOT_CHANGED."
          schema:
            type: "string"
