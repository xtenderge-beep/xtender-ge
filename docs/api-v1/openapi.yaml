    description: "What the service and this account can do."
  - name: "Account"
    description: "The connected account and connected apps."
  - name: "Provider"
    description: "Provider profile and requests to answer."
  - name: "Catalog"
    description: "Categories, their parameters, locations and units."
  - name: "Tenders"
    description: "Customer requests: draft, moderation, collection, cancel, completion."
  - name: "Offers"
    description: "Provider offers, comparison data, selection and confirmation."
  - name: "Messages"
    description: "Private threads between the owner and each provider."
  - name: "Attachments"
    description: "Photos, PDF and lists of goods (stage 3, planned)."
  - name: "Notifications"
    description: "SMS rules and the link back to a request."
  - name: "Sandbox"
    description: "Only on a sandbox installation."
