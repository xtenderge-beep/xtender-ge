components:
  securitySchemes:
    oauth2:
      type: "oauth2"
      description: "Authorization Code with PKCE (S256), public clients. Sign-in by phone and SMS code on xtender.ge. Metadata: /.well-known/oauth-authorization-server."
      flows:
        authorizationCode:
          authorizationUrl: "https://xtender.ge/oauth/authorize"
          tokenUrl: "https://xtender.ge/oauth/token"
          refreshUrl: "https://xtender.ge/oauth/token"
          scopes:
            "profile:read": "See your profile: name, language, roles"
            "profile:write": "Change profile settings: name, language, time zone, provider languages and request intake"
            "tenders:read": "See your requests"
            "tenders:write": "Prepare and publish requests, only after you confirm"
            "offers:read": "See offers on your requests and your own offers"
            "offers:write": "Prepare and send offers, choose a provider, only after you confirm"
            "messages:read": "Read messages about your requests"
            "messages:write": "Send messages about your requests, only when you ask"
            "notifications:write": "Change notification settings"
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Stable machine code, e.g. VALIDATION_FAILED, VERSION_MISMATCH, NOT_FOUND."
            message:
              type: "string"
            retryable:
              type: "boolean"
            fields:
              type: "array"
              items:
                type: "object"
                properties:
                  path:
                    type: "string"
                  code:
                    type: "string"
                  allowed:
                    type: "array"
                    items:
                      type: "string"
                required:
                  - "path"
                  - "code"
          required:
            - "code"
            - "message"
            - "retryable"
        request_id:
          type: "string"
        current_version:
          description: "Present on 412 and 409 SNAPSHOT_CHANGED."
        registration_url:
          type: "string"
      required:
        - "error"
        - "request_id"
    Action:
      type: "object"
      properties:
        id:
          type: "string"
        description:
          type: "string"
        operation_id:
          type: "string"
        stage:
          type: "integer"
        supported:
          type: "boolean"
          description: "false = not implemented yet."
        available_to_user:
          oneOf:
            - type: "boolean"
              description: "null for an anonymous request."
            - type: "null"
        unavailable_reason:
          oneOf:
            - type: "string"
              description: "not_implemented, role_required:<roles>, scope_required:<scope>, account_read_only."
            - type: "null"
        required_roles:
          type: "array"
          items:
            type: "string"
        required_scopes:
          type: "array"
          items:
            type: "string"
        requires_confirmation:
          type: "boolean"
          description: "The user must confirm in the chat before the call."
        side_effects:
          type: "array"
          items:
            type: "string"
      required:
        - "id"
        - "operation_id"
        - "supported"
        - "available_to_user"
        - "required_roles"
        - "required_scopes"
        - "requires_confirmation"
        - "side_effects"
    Capabilities:
      type: "object"
      properties:
        api_version:
          type: "string"
        capabilities_version:
          type: "string"
        catalog_version:
          type: "string"
        updated_at:
          type: "string"
          description: "When the catalog took its current version."
          format: "date-time"
        environment:
          type: "string"
          enum:
            - "production"
            - "sandbox"
        language:
          type: "string"
          enum:
            - "ka"
            - "ru"
            - "en"
        service_description:
          type: "string"
        supported_languages:
          type: "array"
          items:
            type: "string"
            enum:
              - "ka"
              - "ru"
              - "en"
        supported_currencies:
          type: "array"
          items:
            type: "string"
        coverage_summary:
          type: "object"
          properties:
            country_code:
              type: "string"
            served_cities:
              type: "array"
              items:
                type: "object"
                properties:
                  id:
                    type: "string"
                  name:
                    type: "string"
            locations_operation_id:
              type: "string"
            note:
              type: "string"
        authenticated:
          type: "boolean"
        account_roles:
          oneOf:
            - type: "array"
              items:
                type: "string"
            - type: "null"
        actions:
          type: "array"
          items:
            $ref: "#/components/schemas/Action"
        category_search:
          type: "object"
        constraints:
          type: "object"
        notification_channels:
          type: "array"
          items:
            type: "object"
            properties:
              channel:
                type: "string"
              supported:
                type: "boolean"
              requires_verified_contact:
                type: "boolean"
              requires_consent:
                type: "boolean"
              note:
                type: "string"
        auth:
          type: "object"
        existing_integrations:
          type: "object"
        request_id:
          type: "string"
      required:
        - "api_version"
        - "capabilities_version"
        - "catalog_version"
        - "updated_at"
        - "service_description"
        - "actions"
        - "request_id"
    Me:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Opaque identifier; do not parse."
        display_name:
          oneOf:
            - type: "string"
            - type: "null"
        roles:
          type: "array"
          items:
            type: "string"
            enum:
              - "customer"
              - "provider"
        locale:
          type: "string"
          enum:
            - "ka"
            - "ru"
            - "en"
        timezone:
          type: "string"
          description: "IANA, default Asia/Tbilisi."
        phone_verified:
          type: "boolean"
        masked_phone:
          oneOf:
            - type: "string"
              description: "The full number is never returned."
            - type: "null"
        account_status:
          type: "string"
          enum:
            - "active"
            - "read_only"
          description: "read_only: reads only. A blocked account gets no answer at all (401)."
        provider:
          oneOf:
            - type: "object"
              properties:
                status:
                  type: "string"
                  enum:
                    - "pending"
                    - "active"
                    - "banned"
                profile_operation_id:
                  type: "string"
            - type: "null"
        available_actions:
          type: "array"
          items:
            type: "string"
        usage_limits:
          type: "object"
        session:
          type: "object"
          properties:
            id:
              type: "string"
            client_name:
              type: "string"
            scopes:
              type: "array"
              items:
                type: "string"
        environment:
          type: "string"
        version:
          type: "integer"
        created_at:
          type: "string"
          description: "RFC 3339 with offset; stored in UTC."
          format: "date-time"
        updated_at:
          type: "string"
          description: "RFC 3339 with offset; stored in UTC."
          format: "date-time"
        request_id:
          type: "string"
      required:
        - "id"
        - "roles"
        - "locale"
        - "timezone"
        - "account_status"
        - "version"
        - "request_id"
    MeUpdate:
      type: "object"
      properties:
        display_name:
          oneOf:
            - type: "string"
              minLength: 1
              maxLength: 80
            - type: "null"
        locale:
          type: "string"
          enum:
            - "ka"
            - "ru"
            - "en"
        timezone:
          type: "string"
          description: "IANA time zone."
      additionalProperties: false
    ProviderProfile:
      type: "object"
      properties:
        user_id:
          type: "string"
        provider_id:
          type: "string"
        status:
          type: "string"
          enum:
            - "pending"
            - "active"
            - "banned"
        display_name:
          type: "string"
          description: "Latin, as customers see it."
        category_ids:
          type: "array"
          items:
            type: "string"
          description: "Active categories assigned by moderators."
        services:
          type: "array"
          items:
            type: "object"
            properties:
              category_id:
                type: "string"
              active:
                type: "boolean"
              is_primary:
                type: "boolean"
              attributes:
                type: "object"
                description: "Provider characteristics, see the category fields."
        service_area_ids:
          type: "array"
          items:
            type: "string"
          description: "city:<slug>."
        languages:
          type: "array"
          items:
            type: "string"
          description: "Spoken languages: ka, ru, en, hy, az, tr, uk."
        availability_status:
          type: "string"
          enum:
            - "available"
            - "unsubscribed"
          description: "unsubscribed — new requests are not sent to this provider."
        description:
          oneOf:
            - type: "object"
              properties:
                text:
                  oneOf:
                    - type: "string"
                    - type: "null"
                language:
                  oneOf:
                    - type: "string"
                    - type: "null"
                original_text:
                  type: "string"
                original_language:
                  oneOf:
                    - type: "string"
                    - type: "null"
            - type: "null"
        notification_preferences:
          type: "object"
        rating:
          oneOf:
            - type: "number"
              description: "Average of moderated customer reviews; null when there are none."
            - type: "null"
        review_count:
          type: "integer"
        rating_source:
          oneOf:
            - type: "string"
            - type: "null"
        verification_status:
          type: "string"
          enum:
            - "pending_moderation"
            - "approved_by_moderator"
            - "blocked"
        billing_mode:
          type: "string"
          enum:
            - "free_period"
            - "paid"
        editable_fields:
          type: "array"
          items:
            type: "string"
        moderated_fields:
          type: "array"
          items:
            type: "string"
        version:
          type: "string"
        created_at:
          type: "string"
          description: "RFC 3339 with offset; stored in UTC."
          format: "date-time"
        request_id:
          type: "string"
      required:
        - "user_id"
        - "status"
        - "category_ids"
        - "service_area_ids"
        - "languages"
        - "availability_status"
        - "version"
    ProviderProfileUpdate:
      type: "object"
      properties:
        languages:
          type: "array"
          items:
            type: "string"
          description: "1–20 codes."
        availability_status:
          type: "string"
          enum:
            - "available"
            - "unsubscribed"
      description: "Other fields of ProviderProfile may be sent back unchanged."
    Session:
      type: "object"
      properties:
        id:
          type: "string"
        client_id:
          type: "string"
        client_name:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
        created_at:
          type: "string"
          description: "RFC 3339 with offset; stored in UTC."
          format: "date-time"
        last_used_at:
          oneOf:
            - type: "string"
              description: "RFC 3339 with offset; stored in UTC."
              format: "date-time"
            - type: "null"
        current:
          type: "boolean"
    SessionList:
      type: "object"
      properties:
        items:
          type: "array"
