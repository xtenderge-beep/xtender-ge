  "/tenders/{id}/publish":
    post:
      x-xtender-status: "implemented"
      x-xtender-stage: 2
      operationId: "publishTender"
      tags:
        - "Tenders"
      summary: "Publish after the user confirmed"
      security:
        - oauth2:
            - "tenders:write"
      description: "Show the user the final request first and send confirmed_by_user only after they agree. The request goes to Xtender moderation (publication_status in_review); providers receive it after a moderator approves the dispatch, and the offer collection starts then. The first publication of an account gives 409 CONSENT_REQUIRED with consent_url: the user accepts the Terms and Privacy policy on xtender.ge, then publish again. The draft is validated again against the current category schemas (422 NOT_READY with validation). A repeat of a published request returns it unchanged."
      x-xtender-side-effects:
        - "tender_published"
        - "dispatch_queued"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Tender id."
          schema:
            type: "string"
        - name: "If-Match"
          in: "header"
          required: true
          description: "Version (ETag) of the object you read."
          schema:
            type: "string"
        - name: "Idempotency-Key"
          in: "header"
          required: true
          description: "Unique key of this action. A repeat with the same body returns the first result and has no new effect; another body with the same key gives 409. Kept 24 hours or longer."
          schema:
            type: "string"
            maxLength: 100
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                confirmation:
                  type: "object"
                  properties:
                    confirmed_by_user:
                      const: true
                  required:
                    - "confirmed_by_user"
              required:
                - "confirmation"
      responses:
        "202":
          description: "Accepted"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PublishResult"
