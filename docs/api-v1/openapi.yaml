  description: "REST API of xtender.ge for the ChatGPT plugin (MCP adapter) and other clients. Implemented: discovery, accounts, catalog, provider profile, requests, offers, selection, threads, notifications; operations marked x-xtender-status: planned (projects, operations, attachments) are a proposed contract and do not exist yet. Side-effect POSTs need Idempotency-Key. Errors: {error:{code,message,fields?,retryable}, request_id}. Money: integer minor units (tetri). Times: RFC 3339. Versions: ETag / If-Match. Every response carries X-Request-Id and X-Xtender-Environment."
servers:
  - url: "https://xtender.ge/api/v1"
